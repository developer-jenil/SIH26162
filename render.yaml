services:
  - type: web
    name: agnivani
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OFFLINE_MODE
        value: "true"
      - key: AGNIVANI_READONLY_DB
        value: "1"
      - key: SCORER_BACKEND
        value: "heuristic"
      - key: LOG_LEVEL
        value: "INFO"
